[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/shared",
    "crates/app-core",
    "crates/app-ui",
    "crates/editor-core",
    "crates/syntax",
    "crates/workspace",
    "crates/language-service",
    "crates/terminal",
    "crates/git",
    "crates/debugger",
    "crates/platform",
]
default-members = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["Your Name"]

[workspace.dependencies]
# UI
iced = { version = "0.14.0", features = ["tokio"] }

# Async and common infrastructure
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Editor and language tooling
ropey = "1.6.1"
tree-sitter = "0.27.1"
ls-types = "0.0.6"

# OS integrations
notify = "8.2.1"
portable-pty = "0.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
